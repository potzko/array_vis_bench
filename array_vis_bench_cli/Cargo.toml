# The interactive visualiser CLI, extracted from the `array_vis_bench` binary so
# it can be reused by any link-root that populates the registry — in particular
# the default spec-only `array_vis_bench` binary whose `ALGORITHMS` comes purely
# from the constraint compiler. Depends ONLY on the ABI crates (registry + picker tree +
# renderer), never on a leaf/family/registry crate or combo_codegen: it folds
# over `ALGORITHMS` + `all_variants()` by fn-pointer/name, so it is agnostic to
# WHERE the entries came from. The binaries are the link roots that decide that.
[package]
name = "array_vis_bench_cli"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
array_vis_bench_core = { path = "../array_vis_bench_core" }
array_vis_bench_traits = { path = "../array_vis_bench_traits" }
sort_logger = { path = "../sort_logger" }
sort_vis = { path = "../sort_vis" }
sort_registry_core = { path = "../sort_registry_core" }
