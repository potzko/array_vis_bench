# Build every binary / bench / test in this workspace with the host CPU's
# full instruction set. We benchmark on the machine we develop on, so
# missing this flag leaves measurable performance on the table — see
# `src/bin/compare_quicksort.rs` for a concrete case (a 4-5% gap closed
# entirely by switching from the baseline x86_64 target to native).
#
# Side effect: the resulting binary is not portable to CPUs without the
# features the build machine has. That's fine for a local benchmarking
# / visualisation project.
#
# Every function and every loop header is aligned to 64 bytes. Without it
# a relink, such as one more crate in the workspace, moves hot loops across
# cache line boundaries and whole families change speed by up to a third
# with their code untouched; `verify.sh` could not tell that from a
# regression. Measured on the 256-ary heap sorts: two binaries that differed
# by one unrelated crate ran them at 389us and 426us unaligned, and at 407us
# both once aligned. The padding costs binary size, not speed.
[build]
rustflags = [
  "-C", "target-cpu=native",
  "-C", "llvm-args=-align-all-functions=6",
  "-C", "llvm-args=-align-all-nofallthru-blocks=6",
]

# `cargo t` runs the whole workspace's tests under nextest in release, which
# reuses the release build and reports per test instead of per target: plain
# `cargo test` prints one result block for each of the hundred odd leaf crate
# targets, nearly all empty. `cargo install cargo-nextest --locked` once.
[alias]
t = "nextest run --release --workspace"
