small_sort_basic = { path = "../crates/small_sorts/small_sort_basic" }
small_sort_insertion = { path = "../crates/small_sorts/small_sort_insertion" }
small_sort_network = { path = "../crates/small_sorts/small_sort_network" }
small_sort_network_16 = { path = "../crates/small_sorts/small_sort_network_16" }
small_sort_deferred_insertion = { path = "../crates/small_sorts/small_sort_deferred_insertion" }
heap_internals_components = { path = "../crates/components/heap_internals_components" }
