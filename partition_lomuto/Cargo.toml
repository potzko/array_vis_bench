[package]
name = "partition_lomuto"
version = "0.1.0"
edition = "2021"
description = "LeftLeftPartition partition (left-left single-pointer scan) as a standalone leaf crate. Phase 3 pilot for the per-leaf split — proves the dep-graph component-discovery path end to end."

[lib]
name = "partition_lomuto"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../array_vis_bench_traits" }
sort_logger = { path = "../sort_logger" }

# Component declaration picked up by `combo_codegen::scan_workspace_components`
# from any wiring crate that depends on this one. The bare type name
# (`LeftLeftPartition`, not `partition_lomuto::LeftLeftPartition`) keeps the generated
# cross-product output byte-identical with the pre-extraction baseline —
# the wiring crate re-exports `LeftLeftPartition` under its old path so the family!
# `uses` block doesn't have to change.
[[package.metadata.array_vis_bench.components]]
role  = "Partition"
type  = "LeftLeftPartition"
label = "left-left pointer"
