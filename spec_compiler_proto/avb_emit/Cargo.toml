# The array-domain emit backend: turns a `spec_core`-resolved algorithm type
# into an `avb_abi::AlgorithmEntry` registration. Build-time only. Depends on
# the compiler (`spec_core`) for the seam trait + `EntryCtx`, but NOT on
# `avb_abi` — the runtime ABI is referenced purely as text in the emitted
# source, so the dependency arrows point one way (avb_emit → spec_core) and the
# runtime ABI crate stays free of any compile-time machinery.
[package]
name = "avb_emit"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spec_core = { path = "../spec_core" }
