[package]
name = "beap_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Beap sort family — `BeapHeap<D>` (bi-parental triangular-layout heap) plugged into `HeapSort<H, DH>` from `heap_sort_lib`. Classic + quickselect-build families (single-pivot + dual-pivot) declared as TOML metadata below."

[lib]
name = "beap_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../array_vis_bench_traits" }
heap_sort_lib = { path = "../heap_sort_lib" }
sort_logger = { path = "../sort_logger" }

# ── Beap sort classic (D × Iterative) ──
[[package.metadata.array_vis_bench.families]]
module = "beap_sort"
type   = "HeapSort<NaryHeapSort<BeapHeap<{D}>, {DH}>>"
uses   = [
    "heap_sort_lib::heap_sort::{HeapSort, NaryHeapSort}",
    "beap_sort_lib::beap_heap::BeapHeap",
]
axes = [
    { var = "D", role = "HeapDirection" },
    { var = "DH", inline = [{ type = "Iterative", label = "iterative" }] },
]
name        = "beap sort"
big_o       = "@inherited"
stable      = false
direct_sort = true
path        = ["heap sorts", "beap", "classic", "{D}", "{DH}"]

# ── Beap sort quick build (single pivot) ──
[[package.metadata.array_vis_bench.families]]
module = "beap_sort"
type   = "HeapSort<NaryHeapSort<BeapHeap<{D}>, {DH}<{HP}, {V}>>>"
uses   = [
    "heap_sort_lib::heap_sort::{HeapSort, NaryHeapSort}",
    "beap_sort_lib::beap_heap::BeapHeap",
]
axes = [
    { var = "D",   role = "HeapDirection" },
    { var = "DH",  role = "QuickDeepHeapify" },
    { var = "HP",  role = "HeapPartition" },
    { var = "V", inline = [
        { type = "FirstElement",    label = "first" },
        { type = "MiddleElement",   label = "middle" },
        { type = "MedianOfThree",   label = "median of 3" },
        { type = "MedianOfMedians", label = "median of medians" },
    ] },
]
name        = "beap sort quick build"
big_o       = "@inherited"
stable      = false
direct_sort = true
path        = ["heap sorts", "beap", "quick build", "{D}", "{DH}", "{HP}", "{V}"]

# ── Beap sort quick build (dual pivot) ──
[[package.metadata.array_vis_bench.families]]
module = "beap_sort"
type   = "HeapSort<NaryHeapSort<BeapHeap<{D}>, {DH}<{DPS}>>>"
uses   = [
    "heap_sort_lib::heap_sort::{HeapSort, NaryHeapSort}",
    "heap_sort_lib::deep_heapify::Iterative",
    "quick_sort_lib::pivot_selectors::{CombinedSelector, NintherDualPivot}",
    "pivot_first::FirstElement",
    "pivot_middle::MiddleElement",
    "pivot_median3::MedianOfThree",
    "pivot_median_of_medians::MedianOfMedians",
    "beap_sort_lib::beap_heap::BeapHeap",
]
axes = [
    { var = "D",   role = "HeapDirection" },
    { var = "DH",  role = "DualPivotQuickDeepHeapify" },
    { var = "DPS", inline = [
        { type = "CombinedSelector<FirstElement, FirstElement>",   label = "first" },
        { type = "CombinedSelector<MiddleElement, MiddleElement>", label = "middle" },
        { type = "NintherDualPivot",                                label = "ninther 1/3 + 2/3" },
    ] },
]
name        = "beap sort quick build dual pivot"
big_o       = "@inherited"
stable      = false
direct_sort = true
path        = ["heap sorts", "beap", "quick build", "dual pivot", "{D}", "{DH}", "{DPS}"]
