[package]
name = "reverse_storage_lib"
version = "0.1.0"
edition = "2021"
description = "ReverseStorage trait + ByteStorage / BitStorage impls for WeakHeapSort. Trait is `SortLogger`-aware (it needs to register / write through the logger), so it lives next to its impls in this leaf rather than in the pure-traits crate."

[lib]
name = "reverse_storage_lib"
path = "src/lib.rs"

[dependencies]
sort_logger = { path = "../sort_logger" }

[[package.metadata.array_vis_bench.components]]
role  = "ReverseStorage"
type  = "ByteStorage"
label = "byte storage"

[[package.metadata.array_vis_bench.components]]
role  = "ReverseStorage"
type  = "BitStorage"
label = "bit storage"
