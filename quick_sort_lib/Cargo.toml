[package]
name = "quick_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Quick sort family — `QuickSort<P, V, SS>`, `DualPivotQuickSort<DPS, SS>` (Yaroslavskiy), deferred variants for both, and the 30 standalone partition registrations (each P × V pair as `Category::Partition`). Hosts `CombinedSelector` and `NintherDualPivot` because the dual-pivot family is foreign-trait-on-local-type and can't live in a per-pivot leaf."

[lib]
name = "quick_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_core = { path = "../array_vis_bench_core" }
array_vis_bench_traits = { path = "../array_vis_bench_traits" }
sort_logger = { path = "../sort_logger" }
sort_registry_core = { path = "../sort_registry_core" }
linkme = "0.3"
ctor = "0.2"
const_format = "0.2"
# Standalone-partition registry imports every partition + pivot variant
# directly. The family TOML uses paths reach them through the same
# leaves at codegen time.
partition_block = { path = "../partition_block" }
partition_hoare = { path = "../partition_hoare" }
partition_lomuto = { path = "../partition_lomuto" }
partition_moving_pivot = { path = "../partition_moving_pivot" }
partition_three_way = { path = "../partition_three_way" }
pivot_first = { path = "../pivot_first" }
pivot_last = { path = "../pivot_last" }
pivot_median3 = { path = "../pivot_median3" }
pivot_median_of_medians = { path = "../pivot_median_of_medians" }
pivot_middle = { path = "../pivot_middle" }
pivot_ninther = { path = "../pivot_ninther" }

# ── QuickSort classic (P × V × SS) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "QuickSort<{P}, {V}, {SS}>"
uses   = [
    "quick_sort_lib::quick_sort::QuickSort",
    "small_sort_basic::{NoSmallSort, Size1SmallSort, Size2SmallSort}",
    "small_sort_insertion::InsertionSmallSort",
    "small_sort_network::NetworkSmallSort",
    "small_sort_network_16::Network16SmallSort",
    "small_sort_insertion_strategy::{LinearInsertion, BinaryInsertion}",
    "partition_block::Block",
    "partition_hoare::Hoare",
    "partition_lomuto::Lomuto",
    "partition_moving_pivot::MovingPivot",
    "partition_moving_pivot_v3::MovingPivotV3",
    "partition_three_way::ThreeWay",
    "pivot_first::FirstElement",
    "pivot_last::LastElement",
    "pivot_median3::MedianOfThree",
    "pivot_median_of_medians::MedianOfMedians",
    "pivot_middle::MiddleElement",
    "pivot_ninther::Ninther",
    "rotation_reversal::ReversalRotation",
]
axes = [
    { var = "P",  role = "Partition" },
    { var = "V",  role = "PivotSelector" },
    { var = "SS", role = "SmallSort" },
]
name        = "quick sort classic"
big_o       = "@inherited"
space       = "@inherited"
stable      = "@inherited"
adaptive    = false
direct_sort = true
asm         = true
path        = ["quick sorts", "classic", "{P}", "{V}", "{SS}"]

# ── QuickSort dual pivot (DPS × SS) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "DualPivotQuickSort<{DPS}, {SS}>"
uses   = [
    "quick_sort_lib::dual_pivot_quick_sort::DualPivotQuickSort",
    "quick_sort_lib::pivot_selectors::{CombinedSelector, NintherDualPivot}",
    "small_sort_basic::{NoSmallSort, Size1SmallSort, Size2SmallSort}",
    "small_sort_insertion::InsertionSmallSort",
    "small_sort_network::NetworkSmallSort",
    "small_sort_network_16::Network16SmallSort",
    "small_sort_insertion_strategy::{LinearInsertion, BinaryInsertion}",
    "pivot_first::FirstElement",
    "pivot_last::LastElement",
    "pivot_median3::MedianOfThree",
    "pivot_median_of_medians::MedianOfMedians",
    "pivot_middle::MiddleElement",
    "pivot_ninther::Ninther",
]
axes = [
    { var = "DPS", cross = { left = "PivotSelector", right = "PivotSelector", type_tmpl = "CombinedSelector<{0}, {1}>", label_tmpl = "{0} / {1}" }, extras = [ { type = "NintherDualPivot", label = "ninther 1/3 + 2/3" } ] },
    { var = "SS", role = "SmallSort" },
]
name        = "quick sort dual pivot"
big_o       = "@inherited"
stable      = false
direct_sort = true
path        = ["quick sorts", "dual pivot", "{DPS}", "{SS}"]

# ── DeferredQuickSort (P × V × DSS) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "DeferredQuickSort<{P}, {V}, {DSS}>"
uses   = [
    "quick_sort_lib::deferred_quick_sort::DeferredQuickSort",
    "small_sort_deferred_insertion::DeferredInsertion",
    "small_sort_insertion_strategy::{LinearInsertion, BinaryInsertion}",
    "partition_block::Block",
    "partition_hoare::Hoare",
    "partition_lomuto::Lomuto",
    "partition_moving_pivot::MovingPivot",
    "partition_moving_pivot_v3::MovingPivotV3",
    "partition_three_way::ThreeWay",
    "pivot_first::FirstElement",
    "pivot_last::LastElement",
    "pivot_median3::MedianOfThree",
    "pivot_median_of_medians::MedianOfMedians",
    "pivot_middle::MiddleElement",
    "pivot_ninther::Ninther",
    "rotation_reversal::ReversalRotation",
]
axes = [
    { var = "P",   role = "Partition" },
    { var = "V",   role = "PivotSelector" },
    { var = "DSS", role = "DeferredSmallSort" },
]
name        = "quick sort classic deferred"
big_o       = "@inherited"
stable      = false
direct_sort = true
path        = ["quick sorts", "classic deferred", "{P}", "{V}", "{DSS}"]

# ── DeferredDualPivotQuickSort (DPS × DSS) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "DeferredDualPivotQuickSort<{DPS}, {DSS}>"
uses   = [
    "quick_sort_lib::deferred_dual_pivot_quick_sort::DeferredDualPivotQuickSort",
    "quick_sort_lib::pivot_selectors::{CombinedSelector, NintherDualPivot}",
    "small_sort_deferred_insertion::DeferredInsertion",
    "small_sort_insertion_strategy::{LinearInsertion, BinaryInsertion}",
    "pivot_first::FirstElement",
    "pivot_last::LastElement",
    "pivot_median3::MedianOfThree",
    "pivot_median_of_medians::MedianOfMedians",
    "pivot_middle::MiddleElement",
    "pivot_ninther::Ninther",
]
axes = [
    { var = "DPS", cross = { left = "PivotSelector", right = "PivotSelector", type_tmpl = "CombinedSelector<{0}, {1}>", label_tmpl = "{0} / {1}" }, extras = [ { type = "NintherDualPivot", label = "ninther 1/3 + 2/3" } ] },
    { var = "DSS", role = "DeferredSmallSort" },
]
name        = "quick sort dual pivot deferred"
big_o       = "@inherited"
stable      = false
direct_sort = true
path        = ["quick sorts", "dual pivot deferred", "{DPS}", "{DSS}"]
