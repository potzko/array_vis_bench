[package]
name = "small_sort_insertion"
version = "0.1.0"
edition = "2021"
description = "Insertion-sort-based bounded small sort, generic over an InsertionStrategy (linear / binary) and threshold N."

[lib]
name = "small_sort_insertion"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../array_vis_bench_traits" }
sort_logger = { path = "../sort_logger" }
# Each registered specialisation `InsertionSmallSort<X, N>` needs `X` in
# scope here for the impl — orphan rule. Bringing the strategy leaf in
# centralises the four (LinearInsertion / BinaryInsertion) × (16 / 32)
# instantiations next to the generic struct.
small_sort_insertion_strategy = { path = "../small_sort_insertion_strategy" }

# DEV-DEFAULT TRIM: dev catalog keeps only `InsertionSmallSort<LinearInsertion, 32>`.
# The other three insertion specialisations (linear-16, binary-16, binary-32) are
# commented out to shrink every SmallSort cross product. Uncomment for full-test runs.

[[package.metadata.array_vis_bench.components]]
role  = "SmallSort"
type  = "InsertionSmallSort<LinearInsertion, 32>"
label = "insertion: 32"
uses  = ["small_sort_insertion::InsertionSmallSort", "small_sort_insertion_strategy::LinearInsertion"]

