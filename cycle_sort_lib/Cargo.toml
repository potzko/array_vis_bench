[package]
name = "cycle_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Cycle sort — `CycleSort` (no axes). Self-registers via an inline `sort_registry_macro::sort_family!` call."

[lib]
name = "cycle_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_core = { path = "../array_vis_bench_core" }
array_vis_bench_traits = { path = "../array_vis_bench_traits" }
sort_logger = { path = "../sort_logger" }
sort_registry_core = { path = "../sort_registry_core" }
sort_registry_macro = { path = "../sort_registry_macro" }
linkme = "0.3"
ctor = "0.2"
