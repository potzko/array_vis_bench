[package]
name = "comb_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Comb sort family — `CombSort::sort_with_gaps` driver, `CombSortRatio<NUM, DEN>` const-generic algorithm with `SortAlgo` impl, six interactive-visualiser entries per shrink factor (1.3, √2 ≈ 1.414, φ ≈ 1.618, 4/3, 11/8, 5/4), plus the menu-tree ctor. The matching `CombRatio` components live in `comb_ratio_components`."

[lib]
name = "comb_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_core = { path = "../array_vis_bench_core" }
array_vis_bench_traits = { path = "../array_vis_bench_traits" }
sort_logger = { path = "../sort_logger" }
sort_registry_core = { path = "../sort_registry_core" }
linkme = "0.3"
ctor = "0.2"
const_format = "0.2"

[[package.metadata.array_vis_bench.families]]
module = "comb_sorts"
type   = "{R}"
uses   = [
]
axes = [
    { var = "R", role = "CombRatio" },
]
name        = "comb sort"
big_o       = "O(N^2)"
stable      = false
direct_sort = false
path        = ["comb sorts", "{R}"]
