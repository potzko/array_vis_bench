# Binary crate: the default `array_vis_bench` binary is a spec-only link root —
# its `ALGORITHMS` come entirely from `spec_catalog`. Keeps the `array_vis_bench`
# name stable for the CLI entry point (`cargo run` defaults to it) and hosts the
# auxiliary dev tools in `src/bin/` (auto-discovered: compare_sorts, speed_test,
# measure_random_shell).

[package]
name = "array_vis_bench"
version = "0.1.0"
edition = "2021"
default-run = "array_vis_bench"

[profile.dev]
opt-level = 1

[profile.release]
# Single codegen unit so LLVM's inliner sees every monomorphisation in
# one module. The emitted catalog entries land in `spec_catalog`, and the
# default 16-way split was keeping leaf-trait
# methods (e.g. `ArityHeap::heapify`) out-of-line in the hot path.
codegen-units = 1
# ThinLTO on top: lets the linker import functions across the crate
# graph for inlining, smoothing the per-crate-add layout drift that
# was pushing the heap gate over 1.05 after each registry split.
lto = "thin"

[dependencies]
# The shared interactive CLI (picker + prompts + render). The default
# `array_vis_bench` binary is a SPEC-ONLY link root: it anchors only the spec
# crates below and calls array_vis_bench_cli::run().
array_vis_bench_cli = { path = "array_vis_bench_cli" }
array_vis_bench_traits = { path = "array_vis_bench_traits" }
# Registry/harness ABI — the `speed_test` aux tool iterates its `ALGORITHMS`.
array_vis_bench_core = { path = "array_vis_bench_core" }
# Bin-only direct deps for the CLI / harness layer and the aux tools.
rand = "0.8"
sort_logger = { path = "sort_logger" }
sort_vis = { path = "sort_vis" }
sort_registry_core = { path = "sort_registry_core" }
# The unified spec catalog the default binary anchors: ONE crate whose build.rs
# lowers every `.avbs` query over one `catalog.spec` and emits AlgorithmEntry rows
# (spec → emit → register → visualise) for all families.
spec_catalog = { path = "spec_catalog" }

# ── Aux-dev-tool deps (src/bin/) ──────────────────────────────────────────────
# `compare_sorts` benchmarks hand-rolled sorts against these concrete library
# types (driven by NoOpLogger so trait/inlining overhead is all that's measured).
heap_sort_lib = { path = "crates/families/heap_sort_lib" }
merge_sort_lib = { path = "crates/families/merge_sort_lib" }
quick_sort_lib = { path = "crates/families/quick_sort_lib" }
partition_lomuto = { path = "crates/partitions/partition_lomuto" }
pivot_first = { path = "crates/pivots/pivot_first" }
small_sort_insertion = { path = "crates/small_sorts/small_sort_insertion" }
small_sort_insertion_strategy = { path = "crates/small_sorts/small_sort_insertion_strategy" }
# `measure_random_shell` drives this family's RandomShellSort types directly.
fun_sorts_lib = { path = "crates/families/fun_sorts_lib" }

# Binaries are auto-discovered: src/main.rs → `array_vis_bench` (the default
# spec-only visualiser); src/bin/*.rs → the aux dev tools (compare_sorts,
# speed_test, measure_random_shell).
