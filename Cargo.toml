# Make `cargo test` / `cargo build` cover every workspace member by default.
# Without this the hybrid root (workspace + binary package) would scope
# every non-`--workspace` command to just the binary crate, hiding all the
# leaf-crate tests like `heap_sort_lib::set_quick_select`,
# `quick_heap_sort_lib::correctness`, and `combo_codegen::family::tests`.
