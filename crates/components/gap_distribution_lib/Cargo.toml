[package]
name = "gap_distribution_lib"
version = "0.1.0"
edition = "2021"
description = "GapDistribution trait + Uniform / Parabolic impls for RandomShellSort. Trait lives here rather than in `array_vis_bench_traits` because it depends on `rand::Rng`, which we don't want to drag into the pure-traits crate."

[lib]
name = "gap_distribution_lib"
path = "src/lib.rs"

[dependencies]
rand = "0.8"

# Spec catalog fragment (gathered by `spec_catalog`'s build). Spec-only — this
# crate contributes the 5 GapDistribution components but declares no top-level
# query; `fun_sorts`'s `RandomShellSort` query fans over them.
[package.metadata.array_vis_bench]
spec = "gap_distribution.spec"

[[package.metadata.array_vis_bench.components]]
role  = "GapDistribution"
type  = "UniformDist"
label = "uniform"

[[package.metadata.array_vis_bench.components]]
role  = "GapDistribution"
type  = "ParabolicDist"
label = "parabolic"

[[package.metadata.array_vis_bench.components]]
role  = "GapDistribution"
type  = "CubicDist"
label = "cubic"

[[package.metadata.array_vis_bench.components]]
role  = "GapDistribution"
type  = "LogUniformDist"
label = "log uniform"

[[package.metadata.array_vis_bench.components]]
role  = "GapDistribution"
type  = "Distinct<ParabolicDist>"
label = "distinct parabolic"
