[package]
name = "small_sort_deferred_insertion"
version = "0.1.0"
edition = "2021"
description = "DeferredInsertion<S, N> — quicksort stops at sub-arrays of length ≤ N and one final insertion-sort pass cleans up."

[lib]
name = "small_sort_deferred_insertion"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
small_sort_insertion_strategy = { path = "../small_sort_insertion_strategy" }

[package.metadata.array_vis_bench]
spec = "small_sort_deferred_insertion.spec"
