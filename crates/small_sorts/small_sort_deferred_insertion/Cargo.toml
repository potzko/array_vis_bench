[package]
name = "small_sort_deferred_insertion"
version = "0.1.0"
edition = "2021"
description = "DeferredInsertion<S, N> — quicksort stops at sub-arrays of length ≤ N and one final insertion-sort pass cleans up."

[lib]
name = "small_sort_deferred_insertion"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
small_sort_insertion_strategy = { path = "../small_sort_insertion_strategy" }

[[package.metadata.array_vis_bench.components]]
role  = "DeferredSmallSort"
type  = "DeferredInsertion<LinearInsertion, 16>"
label = "deferred insertion: 16"
uses  = ["small_sort_deferred_insertion::DeferredInsertion", "small_sort_insertion_strategy::LinearInsertion", "small_sort_insertion_strategy::BinaryInsertion"]

[[package.metadata.array_vis_bench.components]]
role  = "DeferredSmallSort"
type  = "DeferredInsertion<LinearInsertion, 32>"
label = "deferred insertion: 32"
uses  = ["small_sort_deferred_insertion::DeferredInsertion", "small_sort_insertion_strategy::LinearInsertion", "small_sort_insertion_strategy::BinaryInsertion"]

[[package.metadata.array_vis_bench.components]]
role  = "DeferredSmallSort"
type  = "DeferredInsertion<BinaryInsertion, 16>"
label = "deferred binary insertion: 16"
uses  = ["small_sort_deferred_insertion::DeferredInsertion", "small_sort_insertion_strategy::LinearInsertion", "small_sort_insertion_strategy::BinaryInsertion"]

[[package.metadata.array_vis_bench.components]]
role  = "DeferredSmallSort"
type  = "DeferredInsertion<BinaryInsertion, 32>"
label = "deferred binary insertion: 32"
uses  = ["small_sort_deferred_insertion::DeferredInsertion", "small_sort_insertion_strategy::LinearInsertion", "small_sort_insertion_strategy::BinaryInsertion"]
