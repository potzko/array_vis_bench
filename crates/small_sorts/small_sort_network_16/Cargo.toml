[package]
name = "small_sort_network_16"
version = "0.1.0"
edition = "2021"
description = "Network16SmallSort — Batcher's odd-even merge sort network for 16 elements (63 comparators)."

[lib]
name = "small_sort_network_16"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
# Chains to the 8-element network and falls back to linear insertion.
small_sort_network = { path = "../small_sort_network" }
small_sort_insertion_strategy = { path = "../small_sort_insertion_strategy" }

[[package.metadata.array_vis_bench.components]]
role  = "SmallSort"
type  = "Network16SmallSort"
label = "network: 16"

[[package.metadata.array_vis_bench.components]]
role  = "NonTrivialSmallSort"
type  = "Network16SmallSort"
label = "network: 16"
