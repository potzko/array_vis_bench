# The tree_sort_lib crate: `TreeSort<B>`, its `Tree` fillers, and the catalog
# fragment and query of the family.
[package]
name = "tree_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Tree sort, `TreeSort<B>`: the array as the node store of a binary search tree, one packed link word per node, over a tree axis. Types only; the spec catalog emits the entries."

[lib]
name = "tree_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Catalog fragment and query, owned by this crate and gathered by
# `spec_catalog` through the dependency graph.
[package.metadata.array_vis_bench]
spec  = "tree.spec"
query = "tree.avbs"
