[package]
name = "insertion_sort_lib"
version = "0.1.0"
edition = "2021"
description = "InsertionSort<S> generic over an InsertionStrategy (linear / binary). Single-axis family — emitted into array_vis_bench_core::ALGORITHMS by the spec catalog from this crate's `insertion.spec`/`insertion.avbs` fragment."

[lib]
name = "insertion_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
small_sort_insertion_strategy = { path = "../../small_sorts/small_sort_insertion_strategy" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk.
[package.metadata.array_vis_bench]
spec  = "insertion.spec"
query = "insertion.avbs"
