# The level_sort_lib crate: `LevelSort`, the level ordered heap refined by
# stable selection into a stable in place sort, and the catalog fragment and
# query of the family.
[package]
name = "level_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Level sort, `LevelSort<P, R>`: a stable in place sort that builds the level ordered heap by stable selection at the power of two boundaries, then refines each level by stable selection of its median down to insertion sorted runs, over a stable partition and a rotation. Types only; the spec catalog emits the entries."

[lib]
name = "level_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

[dev-dependencies]
# The stable partitions and three rotations for the module tests: reversal,
# which needs no scratch, trinity, whose scratch is fixed, and auxiliary, whose
# scratch grows with the array.
extraction_lib = { path = "../../components/extraction_lib" }
rotation_reversal = { path = "../../rotations/rotation_reversal" }
rotation_trinity = { path = "../../rotations/rotation_trinity" }
rotation_auxiliary = { path = "../../rotations/rotation_auxiliary" }
