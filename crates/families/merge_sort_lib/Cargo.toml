[package]
name = "merge_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Merge sort family: TopDown/BottomUp/Naive/Natural classic merge sorts, the rotation-based merge sorts (TopDownRotationMergeSort, BottomUpRotationMergeSort), the RotationMerge trait with its naive and smaller-side merges, and the first-class merge kinds, all declared in merge.spec."

[lib]
name = "merge_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk.
[package.metadata.array_vis_bench]
spec  = "merge.spec"
query = "merge.avbs"
