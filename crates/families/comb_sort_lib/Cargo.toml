[package]
name = "comb_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Comb sort family: the `CombSort::sort_with_gaps` driver and the `CombSortRatio<NUM, DEN>` const-generic algorithm, with six shrink ratios (1.3, sqrt 2, phi, 4/3, 11/8, 5/4) declared in comb.spec."

[lib]
name = "comb_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk.
[package.metadata.array_vis_bench]
spec  = "comb.spec"
query = "comb.avbs"
