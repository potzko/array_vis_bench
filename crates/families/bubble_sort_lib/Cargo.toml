[package]
name = "bubble_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Bubble sort family — BubbleSort, ShakerSort, BubbleSortRecursive (all base algorithms with no axes), plus the OddEvenBubbleSort<S: NonTrivialSmallSort> cross product (declared as a TOML family below)."

[lib]
name = "bubble_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_core = { path = "../../../array_vis_bench_core" }
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
sort_registry_core = { path = "../../../sort_registry_core" }
sort_registry_macro = { path = "../../../sort_registry_macro" }
linkme = "0.3"
ctor = "0.2"

[[package.metadata.array_vis_bench.families]]
module = "bubble_sorts"
type   = "OddEvenBubbleSort<{S}>"
uses   = [
    "bubble_sort_lib::OddEvenBubbleSort",
]
axes = [
    { var = "S", role = "NonTrivialSmallSort" },
]
name        = "odd-even bubble sort"
big_o       = "O(N^2)"
stable      = true
direct_sort = true
path        = ["bubble sorts", "odd-even bubble sort", "{S}"]
