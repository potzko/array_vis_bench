[package]
name = "bubble_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Bubble sort family — BubbleSort, ShakerSort, BubbleSortRecursive (base algorithms, no axes) plus the OddEvenBubbleSort<S: NonTrivialSmallSort> cross product. Types only; the spec catalog emits the entries."

[lib]
name = "bubble_sort_lib"
path = "src/lib.rs"

[dependencies]
# Types only — the spec catalog emits the entries (bubble.spec/bubble.avbs).
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk.
[package.metadata.array_vis_bench]
spec  = "bubble.spec"
query = "bubble.avbs"
