[package]
name = "shell_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Shell sort family: GapSequence trait + 9 sequences (Classic, Knuth, Hibbard, Sedgewick, SedgewickBranching, Ciura, Tokuda, Pratt, Optimized256) and the ShellSort / ShellSortOrdered generic algorithms over them. Self-registers into array_vis_bench_core::ALGORITHMS for every (algorithm × sequence) pair."

[lib]
name = "shell_sort_lib"
path = "src/lib.rs"

[features]
# `self_register` populates the runtime registry (`ALGORITHMS` + the picker nav
# tree) for every (algorithm × sequence) pair. It is OFF by default and no crate
# in this workspace enables it: the spec compiler (`spec_catalog`) is the
# sole registrar of the shell family, so the crate provides only the types.
# (Kept as a dormant opt-in for a standalone combo consumer; enabling it in a
# workspace build would re-introduce duplicate registrations via Cargo feature
# unification.)
default = []
self_register = []

[dependencies]
array_vis_bench_core = { path = "../../../array_vis_bench_core" }
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
sort_registry_core = { path = "../../../sort_registry_core" }
linkme = "0.3"
ctor = "0.2"
const_format = "0.2"

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk. `spec` declares the
# components this family contributes; `query` is the AVBS program that builds them.
[package.metadata.array_vis_bench]
spec  = "shell.spec"
query = "shell.avbs"
