[package]
name = "shell_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Shell sort family: GapSequence trait + 9 sequences (ClassicGaps, Knuth, Hibbard, Sedgewick, SedgewickBranching, Ciura, Tokuda, Pratt, Optimized256) and the ShellSort / ShellSortOrdered generic algorithms over them, declared in shell.spec and built by shell.avbs."

[lib]
name = "shell_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk. `spec` declares the
# components this family contributes; `query` is the AVBS program that builds them.
[package.metadata.array_vis_bench]
spec  = "shell.spec"
query = "shell.avbs"
