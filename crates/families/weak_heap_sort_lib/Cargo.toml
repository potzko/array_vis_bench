[package]
name = "weak_heap_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Weak heap sort — `WeakHeapSort<D, R>` generic over a `Direction` (Min/Max × Forward/Reverse layout) and a `ReverseStorage` (byte-per-bit or bit-packed). Stateful: each sort allocates a `Vec<u8>` of reverse / parity bits through the visualiser-aware aux family."

[lib]
name = "weak_heap_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
heap_sort_lib = { path = "../heap_sort_lib" }
reverse_storage_lib = { path = "../../components/reverse_storage_lib" }
sort_logger = { path = "../../../sort_logger" }

[[package.metadata.array_vis_bench.families]]
module = "weak_heap_sort"
type   = "HeapSort<WeakHeapSort<{D}, {R}>>"
uses   = [
    "weak_heap_sort_lib::weak_heap_sort::WeakHeapSort",
    "heap_sort_lib::heap_sort::HeapSort",
]
axes = [
    { var = "D", role = "HeapDirection" },
    { var = "R", role = "ReverseStorage" },
]
name        = "weak heap sort"
big_o       = "@inherited"
stable      = false
direct_sort = true
path        = ["heap sorts", "weak", "{D}", "{R}"]
