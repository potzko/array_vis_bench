[package]
name = "fun_sorts_lib"
version = "0.1.0"
edition = "2021"
description = "Fun sorts grab bag — bad heap sort (alt + classic), cyclent (4 variants × 4 partitions), slow sort, slow sort potzko, stooge, quick surrender (classic + optimised, single + dual pivot), random shell sort. Mixed direct registrations (`sort_family!`) and TOML families for the cross-product axes."

[lib]
name = "fun_sorts_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_core = { path = "../../../array_vis_bench_core" }
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
sort_registry_core = { path = "../../../sort_registry_core" }
sort_registry_macro = { path = "../../../sort_registry_macro" }
linkme = "0.3"
ctor = "0.2"
gap_distribution_lib = { path = "../../components/gap_distribution_lib" }
rand = "0.8"

# ── Cyclent sort variants (P: Partition inline subset) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "CyclentSort<{P}>"
uses   = [
    "fun_sorts_lib::cyclent_sort::CyclentSort",
    "partition_lomuto::LeftLeftPartition",
    "partition_hoare::LeftRightPartition",
    "partition_three_way::ThreeWay",
    "partition_block::Block",
    "pivot_first::FirstElement",
    "pivot_middle::MiddleElement",
]
axes = [
    { var = "P", inline = [
        { type = "LeftLeftPartition",   label = "left-left pointer" },
        { type = "LeftRightPartition",    label = "left-right pointer" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
]
name        = "cyclent sort"
big_o       = "O(N^3?)"
stable      = false
direct_sort = true
path        = ["fun sorts", "cyclent sort", "{P}"]

[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "CyclentSortOpt<{P}>"
uses   = [
    "fun_sorts_lib::cyclent_sort_opt::CyclentSortOpt",
]
axes = [
    { var = "P", inline = [
        { type = "LeftLeftPartition",   label = "left-left pointer" },
        { type = "LeftRightPartition",    label = "left-right pointer" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
]
name        = "cyclent sort opt"
big_o       = "O(N^2)"
stable      = false
direct_sort = true
path        = ["fun sorts", "cyclent sort opt", "{P}"]

[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "CyclentSortStack<{P}>"
uses   = [
    "fun_sorts_lib::cyclent_sort_stack::CyclentSortStack",
]
axes = [
    { var = "P", inline = [
        { type = "LeftLeftPartition",   label = "left-left pointer" },
        { type = "LeftRightPartition",    label = "left-right pointer" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
]
name        = "cyclent sort stack"
big_o       = "O(N log N)"
stable      = false
direct_sort = true
path        = ["fun sorts", "cyclent sort stack", "{P}"]

[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "CyclentSortStackOptimized<{P}>"
uses   = [
    "fun_sorts_lib::cyclent_sort_stack_optimized::CyclentSortStackOptimized",
]
axes = [
    { var = "P", inline = [
        { type = "LeftLeftPartition",   label = "left-left pointer" },
        { type = "LeftRightPartition",    label = "left-right pointer" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
]
name        = "cyclent sort stack optimized"
big_o       = "O(N log N)"
stable      = false
direct_sort = true
path        = ["fun sorts", "cyclent sort stack optimized", "{P}"]

# ── Stooge sort (SS inline subset) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "StoogeSort<{SS}>"
uses   = [
    "fun_sorts_lib::stooge_sort::StoogeSort",
]
axes = [
    # DEV-DEFAULT TRIM: aligned with the trimmed SmallSort registry. Leaving
    # the commented-out entries active produces "type not in scope" because
    # their `use` paths are no longer brought in by the role union.
    # Uncomment together with the matching registry entries.
    { var = "SS", inline = [
        # { type = "InsertionSmallSort<LinearInsertion, 16>", label = "insertion: 16" },
        { type = "InsertionSmallSort<LinearInsertion, 32>", label = "insertion: 32" },
        # { type = "InsertionSmallSort<BinaryInsertion, 16>", label = "binary insertion: 16" },
        # { type = "InsertionSmallSort<BinaryInsertion, 32>", label = "binary insertion: 32" },
        # { type = "NetworkSmallSort",                         label = "network: 8" },
        { type = "Network16SmallSort",                       label = "network: 16" },
    ] },
]
name             = "stooge sort"
big_o            = "O(N^2.71)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "stooge sort", "{SS}"]
max_n_for_tests  = 500

# ── Random shell sort (D: GapDistribution) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "RandomShellSort<{D}>"
uses   = [
    "fun_sorts_lib::random_shell_sort::RandomShellSort",
]
axes = [
    { var = "D", role = "GapDistribution" },
]
name             = "random shell sort"
big_o            = "O(N^1.5)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "random shell sort", "{D}"]
max_n_for_tests  = 1000

# ── Quick surrender (single pivot Alg × P inline × V) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "QuickSurrender<{Alg}<{P}, {V}>>"
uses   = [
    "fun_sorts_lib::quick_surrender::QuickSurrender",
]
axes = [
    { var = "Alg", role = "QuickSelect" },
    { var = "P", inline = [
        { type = "LeftLeftPartition",   label = "left-left pointer" },
        { type = "LeftRightPartition",    label = "left-right pointer" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
    { var = "V", role = "PivotSelector" },
]
name             = "quick surrender"
big_o            = "O(N^2)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "quick surrender", "{Alg}", "{P}", "{V}"]
max_n_for_tests  = 500

# ── Quick surrender (dual pivot: DualPivotPartition partition × dual selector) ──
# Folded into the unified QuickSelect<P, V> types: dual-pivot is just the
# `yaroslavskiy` partition with a dual-pivot PivotInput selector.
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "QuickSurrender<{Alg}<DualPivotPartition, {DPS}>>"
uses   = [
    "quick_sort_lib::pivot_selectors::{CombinedSelector, NintherDualPivot}",
    "quick_sort_lib::DualPivotPartition",
    "fun_sorts_lib::quick_surrender::QuickSurrender",
]
axes = [
    { var = "Alg", role = "QuickSelect" },
    { var = "DPS", inline = [
        { type = "CombinedSelector<FirstElement, FirstElement>",   label = "first / first" },
        { type = "CombinedSelector<MiddleElement, MiddleElement>", label = "middle / middle" },
        { type = "NintherDualPivot",                                label = "ninther 1/3 + 2/3" },
    ] },
]
name             = "quick surrender"
big_o            = "O(N^2)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "quick surrender", "{Alg}", "dual pivot", "{DPS}"]
max_n_for_tests  = 500

# ── Quick surrender optimised (single pivot, plus SS) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "QuickSurrenderOptimised<{Alg}<{P}, {V}>, {SS}>"
uses   = [
    "fun_sorts_lib::quick_surrender_optimised::QuickSurrenderOptimised",
]
axes = [
    { var = "Alg", role = "QuickSelect" },
    { var = "P", inline = [
        { type = "LeftLeftPartition",   label = "left-left pointer" },
        { type = "LeftRightPartition",    label = "left-right pointer" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
    { var = "V",  role = "PivotSelector" },
    { var = "SS", role = "NonTrivialSmallSort" },
]
name             = "quick surrender optimised"
big_o            = "O(N log N)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "quick surrender optimised", "{Alg}", "{P}", "{V}", "{SS}"]
max_n_for_tests  = 1000

# ── Quick surrender optimised (dual pivot: DualPivotPartition × dual selector) ──
# Folded into the unified QuickSelect<P, V> types — dual-pivot is the
# `yaroslavskiy` partition with a dual-pivot PivotInput selector.
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "QuickSurrenderOptimised<{Alg}<DualPivotPartition, {DPS}>, {SS}>"
uses   = [
    "quick_sort_lib::pivot_selectors::{CombinedSelector, NintherDualPivot}",
    "quick_sort_lib::DualPivotPartition",
    "fun_sorts_lib::quick_surrender_optimised::QuickSurrenderOptimised",
]
axes = [
    { var = "Alg", role = "QuickSelect" },
    { var = "DPS", inline = [
        { type = "CombinedSelector<FirstElement, FirstElement>",   label = "first / first" },
        { type = "CombinedSelector<MiddleElement, MiddleElement>", label = "middle / middle" },
        { type = "NintherDualPivot",                                label = "ninther 1/3 + 2/3" },
    ] },
    { var = "SS", role = "NonTrivialSmallSort" },
]
name             = "quick surrender optimised"
big_o            = "O(N log N)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "quick surrender optimised", "{Alg}", "dual pivot", "{DPS}", "{SS}"]
max_n_for_tests  = 1000
