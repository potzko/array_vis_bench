[package]
name = "fun_sorts_lib"
version = "0.1.0"
edition = "2021"
description = "Fun sorts grab bag — bad heap sort (alt + classic), cyclent (4 variants × 4 partitions), slow sort, slow sort potzko, stooge, quick surrender (classic + optimised, single + dual pivot), random shell sort. Types only; the spec catalog emits the entries."

[lib]
name = "fun_sorts_lib"
path = "src/lib.rs"

[dependencies]
# Types only — the spec catalog emits the entries (fun_sorts.spec/fun_sorts.avbs).
# `gap_distribution_lib` + `rand` are used by the random-shell-sort algorithm itself.
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
gap_distribution_lib = { path = "../../components/gap_distribution_lib" }
rand = "0.8"

# Spec catalog fragment + query (gathered by `spec_catalog`'s build): the fun-sorts
# family. `spec` declares the components; the `.avbs` query nests the QuickSelect
# role (Phase 1) inside the quick-surrender drivers.
[package.metadata.array_vis_bench]
spec  = "fun_sorts.spec"
query = "fun_sorts.avbs"
