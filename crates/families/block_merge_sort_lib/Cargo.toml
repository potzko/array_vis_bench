# The block_merge_sort_lib crate: `BlockMergeSort`, the WikiSort and GrailSort shapes.
[package]
name = "block_merge_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Block merge sort, `BlockMergeSort<Buffer, Keys, Rotation, Extraction, Merge>`: a stable merge sort that rolls blocks of one run through the other, merging with a small buffer, tagging the blocks with a key region and rotating with any rotation. The in array buffer with in array keys is WikiSort, a fixed external buffer with in array keys is GrailSort with a buffer."

[lib]
name = "block_merge_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
scratchspace_lib = { path = "../../components/scratchspace_lib" }
merge_sort_lib = { path = "../merge_sort_lib" }

# The scratchspace crate is used by the catalog, not by the Rust code: its
# fragment fills this family's `buffer` and `keys` slots, and a catalog built from
# this crate's dependency closure finds it only through this dependency.
[lints.cargo]
unused_dependencies = "allow"

[dev-dependencies]
# Four rotations for the module tests: reversal, which needs no scratch,
# trinity and block cycle, whose scratch is fixed, and auxiliary, whose scratch
# grows with the array. The extractions, so that each shape under test names one.
extraction_lib = { path = "../../components/extraction_lib" }
rotation_reversal = { path = "../../rotations/rotation_reversal" }
rotation_trinity = { path = "../../rotations/rotation_trinity" }
rotation_block_cycle = { path = "../../rotations/rotation_block_cycle" }
rotation_auxiliary = { path = "../../rotations/rotation_auxiliary" }

# Catalog fragment and query, owned by this crate and gathered by
# `spec_catalog` through the dependency graph.
[package.metadata.array_vis_bench]
spec  = "block_merge.spec"
query = "block_merge.avbs"
