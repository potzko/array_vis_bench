# The block_merge_sort_lib crate: `BlockMergeSort`, the WikiSort and GrailSort shapes.
[package]
name = "block_merge_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Block merge sort, `BlockMergeSort<Buffer, Keys>`: a stable merge sort that rolls blocks of one run through the other, merging with a small buffer and tagging the blocks with a key region. The in array buffer with in array keys is WikiSort, a fixed external buffer with in array keys is GrailSort with a buffer."

[lib]
name = "block_merge_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
scratchspace_lib = { path = "../../components/scratchspace_lib" }
rotation_reversal = { path = "../../rotations/rotation_reversal" }

# Catalog fragment and query, owned by this crate and gathered by
# `spec_catalog` through the dependency graph.
[package.metadata.array_vis_bench]
spec  = "block_merge.spec"
query = "block_merge.avbs"
