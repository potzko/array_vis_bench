[package]
name = "rod_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Rod sort family — `RodSort<S, M>` generic over a `BranchingStrategy` and a `RodMerge`. Also hosts `BranchingStrategy` + its six concrete strategies (Classic, Parity3, LogParity, RootParity, Optimised, Fibonacci) since rod sort is their sole consumer."

[lib]
name = "rod_sort_lib"
path = "src/lib.rs"

[features]
# Legacy in-crate self-registration: the `register_rod_sorts` menu-tree ctor and
# the per-variant link-time `ALGORITHMS` rows (`register_rod!` modules). OFF by
# default and enabled nowhere: the spec compiler emits the canonical rod entries
# via the `RodSort<{strategy},{merge}>` driver, so enabling this would
# double-register all 12 variants via feature unification.
default = []
self_register = []

[dependencies]
array_vis_bench_core = { path = "../../../array_vis_bench_core" }
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
sort_registry_core = { path = "../../../sort_registry_core" }
linkme = "0.3"
ctor = "0.2"
const_format = "0.2"

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk. (Rod never used
# combo_codegen — it self-registered via the in-crate `register_rod!` macro — so
# there is no legacy `[[…families]]` array block here.)
[package.metadata.array_vis_bench]
spec  = "rod.spec"
query = "rod.avbs"
