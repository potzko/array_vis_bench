[package]
name = "rod_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Rod sort family — `RodSort<S, M>` generic over a `BranchingStrategy` and a `RodMerge`. Also hosts `BranchingStrategy` + its six concrete strategies (Classic, Parity3, LogParity, RootParity, Optimised, Fibonacci) since rod sort is their sole consumer."

[lib]
name = "rod_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_core = { path = "../../../array_vis_bench_core" }
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
sort_registry_core = { path = "../../../sort_registry_core" }
linkme = "0.3"
ctor = "0.2"
const_format = "0.2"
