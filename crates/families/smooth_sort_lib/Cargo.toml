# The smooth_sort_lib crate: `SmoothSort`, a heap sort whose heap is a forest of
# trees grown one element at a time, and the catalog fragment and query of the
# family.
[package]
name = "smooth_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Smooth sort, `SmoothSort<D, S, F, B>`: a heap sort in place whose heap is a forest of trees laid out in post order, the greatest element always last, so that a sorted input costs a linear number of comparisons. Over a heap direction, a tree shape (the Leonardo trees or the perfect trees), a sift and a build. Types only; the spec catalog emits the entries."

[lib]
name = "smooth_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
heap_sort_lib = { path = "../heap_sort_lib" }
sort_logger = { path = "../../../sort_logger" }
