[package]
name = "heap_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Heap sort family — `HeapSort<H, DH>` generic over a `Heap` impl + `DeepHeapify` strategy, with `ArityHeap<A, D>` covering the (Arity × Direction) lattice, plus three quickselect-build strategies (Sequential/RecursivePartial/StackPartial) and a dual-pivot DualPivotPartition build. The matching component roles (Arity, HeapDirection, HeapPartition, DeepHeapify, QuickDeepHeapify, DualPivotQuickDeepHeapify) live in `heap_internals_components`."

[lib]
name = "heap_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Used only by `#[cfg(test)]` checks of `SetQuickSelect` impls — concrete
# `QuickSelect` + Partition + PivotSelector to drive the new `Sequential`,
# `Recursive`, `Stack` wrappers.
[dev-dependencies]
quick_select_lib = { path = "../quick_select_lib" }
quick_sort_lib = { path = "../quick_sort_lib" }
partition_lomuto = { path = "../../partitions/partition_lomuto" }
partition_hoare = { path = "../../partitions/partition_hoare" }
pivot_first = { path = "../../pivots/pivot_first" }
pivot_median3 = { path = "../../pivots/pivot_median3" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk. heap_sort_lib does not
# self-register, so no feature/gating is needed.
[package.metadata.array_vis_bench]
spec  = "heap.spec"
query = "heap.avbs"
