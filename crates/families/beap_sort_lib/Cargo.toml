[package]
name = "beap_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Beap sort family, `BeapHeap<D>` (bi-parental triangular-layout heap) plugged into `HeapSort<H, DH>` from `heap_sort_lib`. Classic + quickselect-build families (single-pivot + dual-pivot) declared in beap.spec."

[lib]
name = "beap_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
heap_sort_lib = { path = "../heap_sort_lib" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate (gathered by
# `spec_catalog`).
[package.metadata.array_vis_bench]
spec  = "beap.spec"
query = "beap.avbs"
