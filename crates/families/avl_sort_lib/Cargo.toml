# The avl_sort_lib crate: `AvlSort` and its catalog fragment and query.
[package]
name = "avl_sort_lib"
version = "0.1.0"
edition = "2021"
description = "AVL sort, `AvlSort`: the array as the node store of an AVL tree, one packed link word per node. Types only; the spec catalog emits the entry."

[lib]
name = "avl_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Catalog fragment and query, owned by this crate and gathered by
# `spec_catalog` through the dependency graph.
[package.metadata.array_vis_bench]
spec  = "avl.spec"
query = "avl.avbs"
