[package]
name = "circle_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Circle sort family, recursive (parametrised over an ordering of the three sub-operations) and bottom-up (parametrised over a size-traversal direction), with optional near-sort finishing, declared in circle.spec and built by circle.avbs."

[lib]
name = "circle_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }
small_sort_insertion_strategy = { path = "../../small_sorts/small_sort_insertion_strategy" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk.
[package.metadata.array_vis_bench]
spec  = "circle.spec"
query = "circle.avbs"
