[package]
name = "quick_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Quick sort family: the CanonicalQuickSort and DeferredCanonicalQuickSort drivers over one self-pivoting partition, the Pivoted and DualPivoted composites, the Yaroslavskiy DualPivotPartition, and the CombinedSelector and NintherDualPivot dual selectors. The composites are also the first-class partition kind."

[lib]
name = "quick_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk. The fragment declares the
# slotted quick decomposition (drivers + pivots + partitions + small sorts), some
# of whose TYPES live in sibling leaf crates — referenced as plain `uses` text
# resolved in the consumer, so NO compile-time dep is added here.
[package.metadata.array_vis_bench]
spec  = "quick.spec"
query = "quick.avbs"
