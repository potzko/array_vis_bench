[package]
name = "quick_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Quick sort family — `QuickSort<P, V, SS>`, `DualPivotQuickSort<DPS, SS>` (DualPivotPartition), and deferred variants for both. Hosts `CombinedSelector` and `NintherDualPivot` because the dual-pivot family is foreign-trait-on-local-type and can't live in a per-pivot leaf. Standalone `(P × V)` partition registrations now live in the sibling `quick_partition_registry` crate."

[lib]
name = "quick_sort_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk. The fragment declares the
# slotted quick decomposition (drivers + pivots + partitions + small sorts), some
# of whose TYPES live in sibling leaf crates — referenced as plain `uses` text
# resolved in the consumer, so NO compile-time dep is added here. (The `[[…
# families]]` arrays below are the LEGACY combo_codegen declarations — inert in
# the default spec build; combo and spec are never link-combined.)
[package.metadata.array_vis_bench]
spec  = "quick.spec"
query = "quick.avbs"

# ── QuickSort classic (P × V × SS) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "QuickSort<{P}, {V}, {SS}>"
uses   = [
    "quick_sort_lib::quick_sort::QuickSort",
]
axes = [
    { var = "P",  role = "Partition" },
    { var = "V",  role = "PivotSelector" },
    { var = "SS", role = "SmallSort" },
]
name        = "quick sort classic"
big_o       = "@inherited"
space       = "@inherited"
stable      = "@inherited"
adaptive    = false
direct_sort = true
asm         = true
fixed       = ["strategy=standard"]
path        = ["quick sorts", "{P}", "{V}", "{SS}"]

# ── QuickSort dual pivot: combined (two pivot selectors → CombinedSelector) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "QuickSort<DualPivotPartition, {DPS}, {SS}>"
uses   = [
    "quick_sort_lib::quick_sort::QuickSort",
    "quick_sort_lib::yaroslavskiy::DualPivotPartition",
    "quick_sort_lib::pivot_selectors::CombinedSelector",
]
axes = [
    { var = "DPS", cross = { left = "PivotSelector", right = "PivotSelector", type_tmpl = "CombinedSelector<{0}, {1}>", label_tmpl = "{0} / {1}" } },
    { var = "SS", role = "SmallSort" },
]
name        = "quick sort dual pivot"
big_o       = "@inherited"
stable      = false
direct_sort = true
fixed       = ["strategy=standard", "partition=dual pivot", "dual pivot kind=combined"]
path        = ["quick sorts", "dual pivot", "combined", "{DPS}", "{SS}"]

# ── QuickSort dual pivot: specialty (NintherDualPivot) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "QuickSort<DualPivotPartition, NintherDualPivot, {SS}>"
uses   = [
    "quick_sort_lib::quick_sort::QuickSort",
    "quick_sort_lib::yaroslavskiy::DualPivotPartition",
    "quick_sort_lib::pivot_selectors::NintherDualPivot",
]
axes = [
    { var = "SS", role = "SmallSort" },
]
name        = "quick sort dual pivot ninther 1/3 + 2/3"
big_o       = "@inherited"
stable      = false
direct_sort = true
fixed       = ["strategy=standard", "partition=dual pivot", "dual pivot kind=ninther 1/3 + 2/3"]
path        = ["quick sorts", "dual pivot", "ninther 1/3 + 2/3", "{SS}"]

# ── DeferredQuickSort (P × V × DSS) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "DeferredQuickSort<{P}, {V}, {DSS}>"
uses   = [
    "quick_sort_lib::deferred_quick_sort::DeferredQuickSort",
]
axes = [
    { var = "P",   role = "Partition" },
    { var = "V",   role = "PivotSelector" },
    { var = "DSS", role = "DeferredSmallSort" },
]
name        = "quick sort classic deferred"
big_o       = "@inherited"
stable      = false
direct_sort = true
fixed       = ["strategy=deferred"]
path        = ["quick sorts", "{P}", "{V}", "{DSS}"]

# ── DeferredQuickSort dual pivot: combined (two pivot selectors) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "DeferredQuickSort<DualPivotPartition, {DPS}, {DSS}>"
uses   = [
    "quick_sort_lib::deferred_quick_sort::DeferredQuickSort",
    "quick_sort_lib::yaroslavskiy::DualPivotPartition",
    "quick_sort_lib::pivot_selectors::CombinedSelector",
]
axes = [
    { var = "DPS", cross = { left = "PivotSelector", right = "PivotSelector", type_tmpl = "CombinedSelector<{0}, {1}>", label_tmpl = "{0} / {1}" } },
    { var = "DSS", role = "DeferredSmallSort" },
]
name        = "quick sort dual pivot deferred"
big_o       = "@inherited"
stable      = false
direct_sort = true
fixed       = ["strategy=deferred", "partition=dual pivot", "dual pivot kind=combined"]
path        = ["quick sorts", "dual pivot", "combined", "{DPS}", "{DSS}"]

# ── DeferredQuickSort dual pivot: specialty (NintherDualPivot) ──
[[package.metadata.array_vis_bench.families]]
module = "quick_sorts"
type   = "DeferredQuickSort<DualPivotPartition, NintherDualPivot, {DSS}>"
uses   = [
    "quick_sort_lib::deferred_quick_sort::DeferredQuickSort",
    "quick_sort_lib::yaroslavskiy::DualPivotPartition",
    "quick_sort_lib::pivot_selectors::NintherDualPivot",
]
axes = [
    { var = "DSS", role = "DeferredSmallSort" },
]
name        = "quick sort dual pivot deferred ninther 1/3 + 2/3"
big_o       = "@inherited"
stable      = false
direct_sort = true
fixed       = ["strategy=deferred", "partition=dual pivot", "dual pivot kind=ninther 1/3 + 2/3"]
path        = ["quick sorts", "dual pivot", "ninther 1/3 + 2/3", "{DSS}"]
