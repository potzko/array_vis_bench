[package]
name = "cycle_sort_lib"
version = "0.1.0"
edition = "2021"
description = "Cycle sort — `CycleSort` (no axes). Types only; the spec catalog (`spec_catalog`) emits the entry."

[lib]
name = "cycle_sort_lib"
path = "src/lib.rs"

[dependencies]
# Types only — the spec catalog emits the entry (cycle.spec/cycle.avbs).
array_vis_bench_traits = { path = "../../../array_vis_bench_traits" }
sort_logger = { path = "../../../sort_logger" }

# Spec-system catalog fragment + query, OWNED by this crate and gathered by
# `spec_catalog`'s build via the dependency-graph walk.
[package.metadata.array_vis_bench]
spec  = "cycle.spec"
query = "cycle.avbs"
