[package]
name = "fun_sorts_lib"
version = "0.1.0"
edition = "2021"
description = "Fun sorts grab bag — bad heap sort (alt + classic), cyclent (4 variants × 4 partitions), slow sort, slow sort potzko, stooge, quick surrender (classic + optimised, single + dual pivot), random shell sort. Mixed direct registrations (`sort_family!`) and TOML families for the cross-product axes."

[lib]
name = "fun_sorts_lib"
path = "src/lib.rs"

[dependencies]
array_vis_bench_core = { path = "../array_vis_bench_core" }
array_vis_bench_traits = { path = "../array_vis_bench_traits" }
sort_logger = { path = "../sort_logger" }
sort_registry_core = { path = "../sort_registry_core" }
sort_registry_macro = { path = "../sort_registry_macro" }
linkme = "0.3"
ctor = "0.2"
gap_distribution_lib = { path = "../gap_distribution_lib" }
rand = "0.8"

# ── Cyclent sort variants (P: Partition inline subset) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "CyclentSort<{P}>"
uses   = [
    "partition_block::Block",
    "partition_hoare::Hoare",
    "partition_lomuto::Lomuto",
    "partition_three_way::ThreeWay",
    "fun_sorts_lib::cyclent_sort::CyclentSort",
]
axes = [
    { var = "P", inline = [
        { type = "Lomuto",   label = "lomuto" },
        { type = "Hoare",    label = "hoare" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
]
name        = "cyclent sort"
big_o       = "O(N^3?)"
stable      = false
direct_sort = true
path        = ["fun sorts", "cyclent sort", "{P}"]

[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "CyclentSortOpt<{P}>"
uses   = [
    "partition_block::Block",
    "partition_hoare::Hoare",
    "partition_lomuto::Lomuto",
    "partition_three_way::ThreeWay",
    "fun_sorts_lib::cyclent_sort_opt::CyclentSortOpt",
]
axes = [
    { var = "P", inline = [
        { type = "Lomuto",   label = "lomuto" },
        { type = "Hoare",    label = "hoare" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
]
name        = "cyclent sort opt"
big_o       = "O(N^2)"
stable      = false
direct_sort = true
path        = ["fun sorts", "cyclent sort opt", "{P}"]

[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "CyclentSortStack<{P}>"
uses   = [
