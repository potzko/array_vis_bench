# ── Stooge sort (SS inline subset) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "StoogeSort<{SS}>"
uses   = [
    "small_sort_insertion::InsertionSmallSort",
    "small_sort_network::NetworkSmallSort",
    "small_sort_network_16::Network16SmallSort",
    "small_sort_insertion_strategy::{LinearInsertion, BinaryInsertion}",
    "fun_sorts_lib::stooge_sort::StoogeSort",
]
axes = [
    { var = "SS", inline = [
        { type = "InsertionSmallSort<LinearInsertion, 16>", label = "insertion: 16" },
        { type = "InsertionSmallSort<LinearInsertion, 32>", label = "insertion: 32" },
        { type = "InsertionSmallSort<BinaryInsertion, 16>", label = "binary insertion: 16" },
        { type = "InsertionSmallSort<BinaryInsertion, 32>", label = "binary insertion: 32" },
        { type = "NetworkSmallSort",                         label = "network: 8" },
        { type = "Network16SmallSort",                       label = "network: 16" },
    ] },
]
name             = "stooge sort"
big_o            = "O(N^2.71)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "stooge sort", "{SS}"]
max_n_for_tests  = 500

# ── Random shell sort (D: GapDistribution) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "RandomShellSort<{D}>"
uses   = [
    "fun_sorts_lib::random_shell_sort::RandomShellSort",
    "gap_distribution_lib::{UniformDist, ParabolicDist, CubicDist, LogUniformDist, Distinct}",
]
axes = [
    { var = "D", role = "GapDistribution" },
]
name             = "random shell sort"
big_o            = "O(N^1.5)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "random shell sort", "{D}"]
max_n_for_tests  = 1000

# ── Quick surrender (single pivot Alg × P inline × V) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "QuickSurrender<{Alg}<{P}, {V}>>"
uses   = [
    "partition_block::Block",
    "partition_hoare::Hoare",
    "partition_lomuto::Lomuto",
    "partition_three_way::ThreeWay",
    "pivot_first::FirstElement",
    "pivot_last::LastElement",
    "pivot_median3::MedianOfThree",
    "pivot_median_of_medians::MedianOfMedians",
    "pivot_middle::MiddleElement",
    "pivot_ninther::Ninther",
    "quick_select_lib::{IterativeQuickSelect, RecursiveQuickSelect}",
    "fun_sorts_lib::quick_surrender::QuickSurrender",
]
axes = [
    { var = "Alg", role = "QuickSelect" },
    { var = "P", inline = [
        { type = "Lomuto",   label = "lomuto" },
        { type = "Hoare",    label = "hoare" },
        { type = "ThreeWay", label = "three-way" },
        { type = "Block",    label = "block" },
    ] },
    { var = "V", role = "PivotSelector" },
]
name             = "quick surrender"
big_o            = "O(N^2)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "quick surrender", "{Alg}", "{P}", "{V}"]
max_n_for_tests  = 500

# ── Quick surrender (dual pivot Alg × DPS inline) ──
[[package.metadata.array_vis_bench.families]]
module = "fun_sorts"
type   = "QuickSurrender<{Alg}<{DPS}>>"
uses   = [
    "quick_sort_lib::pivot_selectors::{CombinedSelector, NintherDualPivot}",
    "dual_pivot_quick_select_lib::{IterativeDualPivotQuickSelect, RecursiveDualPivotQuickSelect}",
    "pivot_first::FirstElement",
    "pivot_middle::MiddleElement",
    "fun_sorts_lib::quick_surrender::QuickSurrender",
]
axes = [
    { var = "Alg", role = "DualPivotQuickSelectAlg" },
    { var = "DPS", inline = [
        { type = "CombinedSelector<FirstElement, FirstElement>",   label = "first" },
        { type = "CombinedSelector<MiddleElement, MiddleElement>", label = "middle" },
        { type = "NintherDualPivot",                                label = "ninther 1/3 + 2/3" },
    ] },
]
name             = "quick surrender dual pivot"
big_o            = "O(N^2)"
stable           = false
direct_sort      = true
path             = ["fun sorts", "quick surrender", "dual pivot", "{Alg}", "{DPS}"]
max_n_for_tests  = 500

